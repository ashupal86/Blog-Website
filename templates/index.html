{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
    <div class="row">
        <!-- Main Content Area -->
        <div class="col-md-12">
            <h1>Welcome to the Blog</h1>
            <input 
            type="text" 
            id="search-input" 
            name="q" 
            placeholder="Type to search..." 
            oninput="debounceSearch()"
        />
              <!-- Loading Indicator -->



            <div class="list-group" id="posts-container">
                <!-- Posts will be dynamically loaded here -->
            </div>
        </div>
        <button class="btn " onclick="fetchPosts()">Load More</button>
    </div>
</div>

<script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
<script>
    let timeout;

    function debounceSearch() {
        // Clear the previous timeout (if any)
        clearTimeout(timeout);
    
        // Set a new timeout for the search request after a delay
        timeout = setTimeout(function() {
            const query = document.getElementById('search-input').value;
            fetchSearchResults(query);
        }, 500);  // 500ms delay
    }
    
    function fetchSearchResults(query) {
        if (query.trim() === '') {
            return; // Do nothing if the query is empty
        }
    
        // Make the GET request to the /search route
        fetch(`/search?q=${encodeURIComponent(query)}`)
            .then(response => response.json())  // Assuming the response is JSON
            .then(data => {
                // Check if there is data and pass it to renderPosts
                if (data ) {
                    document.getElementById('posts-container').innerHTML = '';
                    renderPosts(data.data);
                    console.log(data);
                } else {
                    // Optionally handle case where no results are found
                    document.getElementById('posts-container').innerHTML = 'No results found.';
                }
            })
            .catch(error => {
                console.error('Error fetching search results:', error);
            });
    }
document.addEventListener("DOMContentLoaded", function() {
    fetchPosts();
});

let page=1
function fetchPosts() {
    fetch(`/get_posts?page=${page}`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 200) {
                renderPosts(data.data);
                console.log(data.data.reverse());
                page++;

            } else {
                alert('Failed to load posts');
            }
        })
        .catch(error => console.error('Error fetching posts:', error));
}

function renderPosts(posts) {
    const postsContainer = document.getElementById('posts-container');
    posts.forEach(post => {
        const postItem = document.createElement('div');
        postItem.className = 'list-group-item mb-3';
        postItem.onclick = function() {
            window.location.href = '/post/' + post['post_id'];
        }
    
        dateformat=post['timestamp'].split(' ')[0].split('-');
        postItem.innerHTML = `
            <div class="d-flex justify-content-between">
                <h5 class="mb-1">${post["post_title"]}</h5> <!-- post_title -->
                <button class="btn btn-primary btn-sm" onclick="sharePost('${post['post_id']}')">Share Post</button> <!-- post_id -->
            </div>
            <p class="mb-1"><strong>Author:</strong> ${post['post_author']}</p> <!-- post_author -->
            <p class="mb-1"><strong>Date:</strong> ${dateformat[2]}-${dateformat[1]}-${dateformat[0]}</p>
            <p class="mb-1">${post['tags']}</p> <!-- tags -->
            <p class="mb-1">${post['post_content']}</p> <!-- post_content -->
            <div id="post-image-${post[0]}" style="display: none;">
                <!-- Image will be generated here -->
            </div>
        `;

        postsContainer.appendChild(postItem);
    });
}





</script>

{% endblock %}
