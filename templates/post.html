{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h1>{{ post.data.post_title }}</h1>
    <p><strong>By:</strong> {{ post.data.post_author }}</p>
    <p><strong>Published on:</strong> {{ post.data.timestamp }}</p>
    <div class="post-content">
        {{ post.data.post_content | safe }}
    </div>
    <p><strong>Tags:</strong> {{ post.data.tags }}</p>
</div>
{% endblock %}
